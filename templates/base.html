<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Herramientas para Informáticos{% endblock %}</title>
    <meta name="description" content="Recursos, guías y utilidades para estudiantes y profesionales de la informática." />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    {% block extra_head %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100 bg-dark text-light">
    <header class="bg-body-secondary border-bottom border-dark py-3 mb-4">
      <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
        <h1 class="h3 mb-0">Herramientas para Informáticos</h1>
        <nav class="nav gap-2 mt-3 mt-md-0">
          <a class="btn btn-outline-light btn-sm" href="/">Inicio</a>
          <a class="btn btn-outline-light btn-sm" href="/blog">Blog</a>
          <a class="btn btn-outline-light btn-sm" href="/contacto">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container flex-grow-1 py-4">
      {% block content %}{% endblock %}
    </main>

    <footer class="bg-body-secondary border-top border-dark py-3">
      <div class="container text-center small">
        &copy; {{ year|default:2025 }} Herramientas para Informáticos. Todos los derechos reservados.
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
